[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions/**/*.js"

[build.environment]
  NODE_VERSION = "20"
  # Set your backend URL here for production
  # NEXT_PUBLIC_API_BASE_URL = "https://your-backend-domain.com"

# Redirect API calls to the backend
# IMPORTANT: Replace the placeholder with your actual deployed backend URL
# Example: to = "https://cybernexus-api.example.com/api/:splat"
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

# Handle Next.js App Router SPA routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions configuration for Netlify Functions (if using)
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**/*"]